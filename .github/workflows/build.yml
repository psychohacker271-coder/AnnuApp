name: Build ANNU APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package VRM and offline 3D runtime
        run: |
          mkdir -p app/src/main/assets/vendor
          cp 4728432443254068622_v001.vrm app/src/main/assets/annu.vrm
          curl -fL https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js -o app/src/main/assets/vendor/three.module.js
          curl -fL https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js -o app/src/main/assets/vendor/GLTFLoader.js
          curl -fL https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js -o app/src/main/assets/vendor/three-vrm.module.min.js
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ANNU-3D-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
