<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;touch-action:none}#msg{position:absolute;left:4px;right:4px;bottom:8px;text-align:center;color:#fff;font:12px sans-serif;text-shadow:0 1px 4px #000;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"}}</script>
</head><body><div id="msg">ANNU 💜 — 3D load ho raha hai…</div><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
const msg=document.getElementById('msg');
const fail=e=>{console.error(e);msg.textContent='3D error: '+(e?.message||String(e)).slice(0,90)};
window.addEventListener('error',e=>fail(e.message||'JavaScript error'));
window.addEventListener('unhandledrejection',e=>fail(e.reason));
try{
 const scene=new THREE.Scene();
 const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.1,100);
 const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'low-power'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0x000000,0);
 document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x665577,2));
 const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(1,2,3);scene.add(key);
 let vrm=null;
 const loader=new GLTFLoader();loader.register(parser=>new VRMLoaderPlugin(parser));
 msg.textContent='ANNU ka model load ho raha hai…';
 loader.load('annu.vrm',gltf=>{
   vrm=gltf.userData.vrm;
   if(!vrm){fail('VRM plugin model ko nahi pehchan paaya');return;}
   VRMUtils.rotateVRM0(vrm);scene.add(vrm.scene);
   const box=new THREE.Box3().setFromObject(vrm.scene);
   const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());
   vrm.scene.position.x-=center.x;vrm.scene.position.y-=box.min.y;
   const h=Math.max(size.y,1.2);camera.position.set(0,h*.58,h*2.7);camera.lookAt(0,h*.48,0);
   vrm.scene.traverse(o=>{o.frustumCulled=false});
   msg.textContent='Ji Boss! Main yahan hoon 💜';
 },p=>{if(p.total)msg.textContent='Model '+Math.round(p.loaded/p.total*100)+'%…'},fail);
 function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
 addEventListener('resize',resize);
 const clock=new THREE.Clock();
 function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(vrm){vrm.update(dt);vrm.scene.rotation.y=Math.sin(performance.now()*.0005)*.07;}renderer.render(scene,camera)}
 animate();
}catch(e){fail(e)}
</script></body></html>
